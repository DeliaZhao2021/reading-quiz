<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ARC Reading Challenge 2026–2027</title>
<style>
:root{--blue:#2d6f9f;--orange:#ee8b2d;--ink:#172b43;--good:#1d824b;--bad:#c64040}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(145deg,#dff5ff,#fff4ba);padding:18px}
.card{max-width:760px;margin:25px auto;background:#fff;border-radius:24px;padding:clamp(20px,5vw,34px);box-shadow:0 12px 35px #3453}
h1{text-align:center;color:var(--blue);font-size:clamp(31px,7vw,52px);margin:0 0 4px}.subtitle{text-align:center;font-weight:800;margin-bottom:28px}
label{font-weight:850;display:block;margin:16px 0 7px}.select{width:100%;padding:15px;font-size:17px;border:2px solid #ccdbe6;border-radius:13px;background:white}
.info{background:#f3f8fc;border-radius:13px;padding:14px;margin:18px 0;color:#526579}.primary,.secondary{border:0;border-radius:13px;padding:14px 19px;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation}.primary{background:var(--orange);color:#fff}.secondary{background:#e9f1f6;color:#284a65}.primary:disabled{opacity:.45}
.full{width:100%}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;font-weight:850}.track{height:11px;background:#e7eef3;border-radius:99px;overflow:hidden;margin:14px 0 22px}.bar{height:100%;background:#499bd0}.question{font-size:clamp(21px,5vw,27px);font-weight:850;margin:10px 0 18px}.answers{display:grid;gap:11px}.answer{width:100%;padding:15px;border:2px solid #cedae4;border-radius:14px;background:#fff;text-align:left;font-size:17px;font-weight:750;cursor:pointer;touch-action:manipulation}.answer.correct{background:#dff5e8;border-color:var(--good)}.answer.wrong{background:#fde3e3;border-color:var(--bad)}.feedback{font-size:19px;font-weight:900;min-height:32px;margin:15px 0}.actions{display:flex;justify-content:space-between;gap:10px}.result{text-align:center}.scoreBig{font-size:64px;font-weight:950;color:var(--blue);margin:8px}.review{text-align:left;margin-top:28px}.miss{border-top:1px solid #e1e8ed;padding:15px 0}.miss b{display:block;margin-bottom:7px}.wrongText{color:var(--bad)}.rightText{color:var(--good)}.badge{display:inline-block;background:#e5f4ea;color:#247047;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:850}
</style>
</head>
<body>
<section id="home" class="card">
<h1>📚 ARC Reading Challenge</h1>
<div class="subtitle">2026–2027 • 5th Grade Hard Practice</div>
<label for="book">Choose a book</label>
<select id="book" class="select">
<option value="mabuhay">Mabuhay! — Zachary Sterling</option>
<option value="lastdragon">The Last Dragon on Mars — Scott Reintgen</option>
<option value="willsrace">Will's Race for Home — Jewell Parker Rhodes</option>
<option value="dogtown">Dogtown — Katherine Applegate & Gennifer Choldenko</option>
<option value="somethinghome">Something Like Home — Andrea Beatriz Arango</option>
<option value="safiyyah">Safiyyah's War — Hiba Noor Khan</option>
</select>
<div id="availability" class="info"><span class="badge">READY</span> 15 practice questions available.</div>
<button id="start" class="primary full">Start Quiz</button>
</section>

<section id="quiz" class="card hidden">
<div class="top"><span id="quizBook"></span><span id="score">Score: 0</span></div>
<div class="track"><div id="bar" class="bar"></div></div>
<div id="counter"></div><div id="question" class="question"></div><div id="answers" class="answers"></div>
<div id="feedback" class="feedback"></div>
<div class="actions"><button id="quit" class="secondary">← Books</button><button id="next" class="primary hidden">Next →</button></div>
</section>

<section id="result" class="card result hidden">
<h1>Quiz Complete!</h1><div id="resultBook"></div><div id="finalScore" class="scoreBig"></div><div id="percent"></div>
<div style="margin-top:22px"><button id="again" class="primary">Play Again</button> <button id="booksBtn" class="secondary">Choose Book</button></div>
<div id="review" class="review"></div>
</section>

<script>
const titles={
mabuhay:"Mabuhay!",lastdragon:"The Last Dragon on Mars",willsrace:"Will's Race for Home",
dogtown:"Dogtown",somethinghome:"Something Like Home",safiyyah:"Safiyyah's War"
};
const bank={"mabuhay":[["How is Althea different from JJ?",["She wants people to accept her as she is","She desperately wants to fit in","She dislikes Filipino food","She refuses to help her family"],0],["What do kids criticize about Althea?",["Her Filipino lunches","Her grades","Her drawings","Her shoes"],0],["What do JJ and Althea share before the attacks?",["The same creepy nightmare","A secret recipe","A school detention","A magical book"],0],["What attacks the siblings?",["Witches and a monster","Robots and aliens","Ghost pirates","Wild animals"],0],["What must JJ and Althea learn to embrace to help save the day?",["Who they are and their culture","Popularity at school","Athletic competition","Life away from family"],0],["What makes JJ and Althea’s reactions to cultural expectations different?",["JJ worries about fitting in; Althea wants acceptance without changing","JJ wants to leave school; Althea wants to leave home","JJ believes in monsters; Althea never does","Both eagerly embrace every family tradition"],0],["Which discovery most directly changes how the siblings understand their mother?",["Her connection to magic and witches","Her former career in sports","Her secret ownership of another truck","Her childhood in Paris"],0],["Why does the food truck create a conflict for JJ?",["Helping the family also makes him feel conspicuous","He cannot eat any of its food","His sister refuses to work there","It prevents him from attending school"],0]],"lastdragon":[["Who was Mars's King-Dragon?",["Ares","Dread","Gaia","Phobos"],0],["What did humans hope killing Ares would do?",["Turn Mars into a paradise like Earth","Destroy Earth","Create a new moon","End space travel"],0],["What happened to that plan?",["It backfired","It worked immediately","Earth stopped it","Ares escaped"],0],["What happens before Lunar discovers the bunker?",["A rival salvage group attacks","He wins a school contest","He leaves Mars voluntarily","He finds a new city"],0],["What will Dread eventually choose?",["A dragoon","A king","A planet","A doctor"],0],["What is a dragoon in the story?",["A human bonded with a dragon for life","A Martian storm","A type of spaceship","A salvage tool"],0],["What is special about celestial bodies in this story world?",["Each has its own dragon avatar","Each is ruled by humans","None can support dragons","All are abandoned"],0],["What is ironic about the settlement name Harvest?",["The environment is dangerous rather than abundant","It is on Earth instead of Mars","Nobody there grows food because all are rich","It is named for a dragon that never existed"],0],["Why is Dread choosing a dragoon significant?",["The bond is meant to last for life","The chosen person becomes the settlement mayor","It will bring Ares back to life","It means the dragon must leave Mars"],0],["Which chain of events best explains Lunar’s arrival at the bunker?",["Rival scrappers attack; Lunar wakes under Poppy’s care","Lunar volunteers for a school trip; he meets Poppy","Ares attacks Harvest; Lunar flees to Earth","Dread chooses Lunar; then he begins scrapping"],0],["How did humans’ expectations about killing Ares differ from the outcome?",["They expected paradise, but Mars became hostile","They expected extinction, but Mars flourished","They expected a new moon, but got a storm","They expected peace, and achieved it"],0]],"willsrace":[["Why does George want to leave Texas?",["He wants land and greater freedom for his family","He wants to join the army","He wants to become a sailor","He wants to attend college"],0],["What was George's childhood marked by?",["Enslavement","Wealth","Life in Europe","Military school"],0],["What does Will learn about George during the journey?",["A painful secret from his past","That George cannot read","That George owns land already","That George plans to return alone"],0],["How does Will and George's relationship change?",["They grow closer and develop mutual respect","They stop speaking","Will leaves George","They become business rivals"],0],["What does Will's literacy help him do early in the story?",["Understand information that affects the family's future","Become a soldier","Repair a wagon","Train Belle"],0],["Who secretly helped Will learn to read?",["Anna","Caesar","John","Grandpa alone"],0],["What does the family's quest for land represent?",["Independence and a home of their own","A vacation","A school assignment","A treasure hunt"],0],["Why does the land rush mean more than simply owning property to George?",["It offers a chance for independence after enslavement","It will make him a soldier again","It guarantees his family wealth","It allows him to avoid traveling"],0],["Why is Will’s ability to read important to the journey?",["He can understand information his father cannot read","It allows him to win a spelling contest","It qualifies him to lead soldiers","It teaches Belle to obey"],0],["What complicates Will’s trust in Caesar?",["Caesar can appear both helpful and threatening","Caesar refuses to travel with them","Caesar cannot ride a horse","Caesar is secretly Will’s brother"],0],["What makes George’s hidden past particularly important to Will?",["It changes his understanding of his father and freedom","It proves the family already owns Oklahoma land","It explains why Belle cannot cross water","It reveals Caesar is a teacher"],0]],"dogtown":[["Why did Chance end up separated from her family?",["Irresponsible dog-sitters skipped town","Her family deliberately abandoned her","She ran away during a storm","She was born at Dogtown"],0],["What is unusual about Metal Head compared with most robot dogs?",["He does not simply obey every command","He cannot move","He looks exactly like Chance","He is afraid of electricity"],0],["Why are organic dogs resentful of robot dogs?",["Robot dogs are often adopted more easily","Robot dogs eat all the food","Robot dogs control the shelter","Robot dogs chase Mouse"],0],["Which book becomes important to Metal Head and Quinn?",["Green Eggs and Ham","Charlotte's Web","The Hobbit","Hatchet"],0],["What is the 'List' feared by the organic dogs?",["A list determining when dogs may be put down","A list of reading buddies","A list of robot repairs","A list of food orders"],0],["What does Metal Head propose to help an older dog get adopted?",["A tail-out protest","A race","A barking contest","A hunger strike"],0],["What does Chance mistake a sign outside for?",["A missing-dog poster for her","A Dogtown advertisement","A map home","A warning sign"],0],["How does Chance's view of Metal Head change?",["Suspicion grows into understanding and friendship","She distrusts him more and more","She never notices him","She decides all robots are dangerous"],0],["Which theme is central to the story?",["Belonging and what makes a family","Winning at sports","Space exploration","Historical land ownership"],0],["Why does Metal Head challenge Chance’s assumptions about robot dogs?",["He shows individuality and a desire for belonging","He is secretly an organic dog","He refuses to interact with children","He is unable to make choices"],0],["Why is the feared List significant to the shelter dogs?",["It raises the stakes of waiting for adoption","It ranks the best robot inventions","It decides which dogs read aloud","It lists food deliveries"],0],["What does the relationship between Quinn and Metal Head challenge?",["The idea that a robot dog cannot form a meaningful bond","The idea that children can read books","The idea that shelters need volunteers","The idea that Chance has three legs"],0],["How does Chance’s attitude toward Metal Head change?",["From distrust toward friendship","From friendship toward hatred","From indifference toward fear","From admiration toward indifference"],0]],"somethinghome":[["Why is Laura removed from her parents' home?",["She calls 911 after finding them unresponsive","She runs away from school","Her aunt requests custody for no reason","Her family moves overseas"],0],["How does Laura initially view her new living arrangement?",["Temporary","Permanent and exciting","A vacation","A punishment from school"],0],["What does Laura name the puppy?",["Sparrow","Chance","Belle","Dread"],0],["Why does Laura want to train Sparrow as a therapy dog?",["She hopes it will let her visit her parents in rehab","She wants to win prize money","Her school requires it","Silvia wants a hospital pet"],0],["What cultural background does Laura's family have?",["Puerto Rican","Filipino","Algerian French","Martian"],0],["What does Laura feel guilty about?",["Calling 911 and the resulting separation","Losing Sparrow","Failing a class","Moving away voluntarily"],0],["What happens when Laura's parents leave rehab early?",["Her stay with Silvia may become permanent","Laura immediately goes home","Silvia moves away","Sparrow is taken away"],0],["What does Laura gradually learn about creating a new home?",["It does not require discarding the old one","It means forgetting her parents","It depends only on where she lives","It requires leaving Sparrow"],0],["Why does Laura initially blame herself for her family separation?",["She called 911 when her parents were unresponsive","She refused to go to school","She lost the family dog","She asked to move in with Silvia"],0],["Why does Laura resist Titi Silvia’s encouragement about Puerto Rican culture?",["It is difficult to accept a new connection while longing for her parents","She has never heard of Puerto Rico","Silvia forbids her to speak Spanish","Laura wants to become a teacher"],0],["What complicates Laura’s original plan to return to her parents?",["Her parents leave rehab early","Sparrow is adopted by someone else","Benson moves overseas","Silvia closes the house"],0],["What does training Sparrow represent for Laura?",["An attempt to reconnect with her parents and find purpose","A plan to enter a national dog show","A way to avoid school forever","A scheme to earn money"],0]],"safiyyah":[["What identity do some of the fake papers give Jewish people?",["Muslim","German soldier","British citizen","French police officer"],0],["What happens to Baba because of his Resistance work?",["He comes under Nazi scrutiny and is arrested","He becomes mayor","He leaves for Britain","He joins the German army"],0],["What dangerous task does Safiyyah take over?",["Delivering papers around Paris","Flying Allied planes","Driving military trucks","Printing newspapers"],0],["How do escapees leave the mosque area secretly?",["Through an underground tunnel","By airplane","Across rooftops","By train"],0],["Where does the underground route lead toward?",["The river","The airport","The mountains","The school"],0],["How are escapees secretly transported onward?",["On barges","On airplanes","On bicycles","On buses"],0],["What happens during the Nazi raid on the mosque?",["Safiyyah must help guide people to safety","The war immediately ends","Safiyyah leaves Paris alone","The mosque is empty"],0],["What helps guide Safiyyah's courageous choices?",["Her Muslim faith and values","A desire for fame","A school prize","A magical power"],0],["What real history inspired the novel?",["The Grand Mosque of Paris helping Jews during Nazi occupation","The Oklahoma Land Rush","A Martian colony","A famous dog shelter"],0],["Why are fake papers identifying Jewish people as Muslim important?",["They offer a way to evade Nazi persecution","They make the holders soldiers","They grant ownership of the mosque","They provide free train travel"],0],["Why is the tunnel beneath the mosque important?",["It creates a hidden route for escape","It stores food for the mosque","It leads to a secret classroom","It connects to the German headquarters"],0],["What does Safiyyah take on after her father comes under suspicion?",["Risky deliveries for the Resistance","Command of the German troops","A journey to Oklahoma","Work at a robot shelter"],0],["Which detail in the teaching guide marks a symbolic moment near the ending?",["Émeraude finally flies out of his cage","Belle crosses a river","Dread chooses a dragoon","Sparrow learns a new trick"],0],["Which person is connected to plants and mille-feuille in the guide?",["Monsieur Cassin","General Poppy","Caesar","Tito Arvin"],0],["What restores Baba’s voice during the climactic events?",["Singing and music","A written letter","A speech by a soldier","A medical operation"],0]]};
let chosen="", questions=[],i=0,points=0,missed=[];
const $=x=>document.getElementById(x);
function updateBook(){
 chosen=$("book").value; let ready=bank[chosen].length>0;
 $("start").disabled=!ready;
 $("availability").innerHTML=ready?'<span class="badge">READY</span> '+bank[chosen].length+' practice questions available.':'<b>Coming soon.</b> This book is already in the library; verified competition questions will be added later.';
}
function start(){
 chosen=$("book").value; if(!bank[chosen].length)return;
 questions=[...bank[chosen]];i=0;points=0;missed=[];
 $("home").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");draw();
}
function draw(){
 let q=questions[i];$("quizBook").textContent=titles[chosen];$("score").textContent="Score: "+points;
 $("counter").textContent="Question "+(i+1)+" of "+questions.length;$("bar").style.width=((i+1)/questions.length*100)+"%";
 $("question").textContent=q[0];$("answers").innerHTML="";$("feedback").textContent="";$("next").classList.add("hidden");
 let correctText=q[1][q[2]];
 let shuffled=q[1].map((a,n)=>({text:a,correct:n===q[2]})).sort(()=>Math.random()-.5);
 shuffled.forEach((opt,n)=>{let b=document.createElement("button");b.className="answer";b.textContent=(q[1].length>2?String.fromCharCode(65+n)+". ":"")+opt.text;b.dataset.correct=opt.correct?"1":"0";b.dataset.answer=opt.text;b.onclick=()=>pick(b,correctText);$("answers").appendChild(b)});
}
function pick(b,correctText){
 let q=questions[i],buttons=[...document.querySelectorAll(".answer")];buttons.forEach(x=>{x.disabled=true;if(x.dataset.correct==="1")x.classList.add("correct")});
 let isCorrect=b.dataset.correct==="1";
 if(isCorrect){points++;$("feedback").textContent="✓ Correct!"}else{b.classList.add("wrong");$("feedback").textContent="✗ Correct answer: "+correctText;missed.push({q:q[0],y:b.dataset.answer,c:correctText})}
 $("score").textContent="Score: "+points;$("next").classList.remove("hidden");
}
function finish(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("resultBook").textContent=titles[chosen];
 $("finalScore").textContent=points+" / "+questions.length;let p=Math.round(points/questions.length*100);$("percent").textContent=p+"%";
 let r=$("review");if(!missed.length){r.innerHTML="<h2>Perfect score! 🎉</h2><p>No missed questions to review.</p>";return}
 r.innerHTML="<h2>Review Missed Questions ("+missed.length+")</h2>";
 missed.forEach((m,j)=>{r.innerHTML+=`<div class="miss"><b>${j+1}. ${m.q}</b><div class="wrongText">Your answer: ${m.y}</div><div class="rightText">Correct answer: ${m.c}</div></div>`});
}
function home(){$("quiz").classList.add("hidden");$("result").classList.add("hidden");$("home").classList.remove("hidden");updateBook()}
$("book").onchange=updateBook;$("start").onclick=start;$("next").onclick=()=>{i++;i<questions.length?draw():finish()};$("quit").onclick=home;$("booksBtn").onclick=home;$("again").onclick=start;updateBook();
</script>
</body></html>
